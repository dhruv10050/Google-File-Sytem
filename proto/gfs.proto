// GFS wire protocol: master, chunkserver, and the master's persistent records
// (operation log + checkpoint). Section references (§) are to the GFS paper.
syntax = "proto3";

package gfs;

option go_package = "github.com/dhruv10050/Google-File-Sytem/api/gfspb;gfspb";

message Empty {}

// ─────────────────────────── Shared ───────────────────────────

message ChunkLocation {
  int64 index = 1;              // chunk index within the file
  uint64 handle = 2;
  uint64 version = 3;           // clients pass this as min_version on reads (§4.5)
  repeated string replicas = 4; // chunkserver addresses
}

message ChunkReport {
  uint64 handle = 1;
  uint64 version = 2;
  int64 length = 3;
}

// ─────────────────────────── Master ───────────────────────────

service Master {
  // Cluster parameters a client or chunkserver must agree on.
  rpc GetConfig(Empty) returns (ConfigResponse);

  // Namespace.
  rpc Mkdir(MkdirRequest) returns (Empty);
  rpc CreateFile(CreateFileRequest) returns (Empty);
  rpc DeleteFile(DeleteFileRequest) returns (Empty);
  rpc List(ListRequest) returns (ListResponse);
  rpc Stat(StatRequest) returns (StatResponse);
  // Copy-on-write snapshot of a file or directory tree (§3.4).
  rpc Snapshot(SnapshotRequest) returns (Empty);
  // Restore a deleted file from its hidden name under /.deleted (§4.4).
  rpc Undelete(UndeleteRequest) returns (UndeleteResponse);

  // Chunk metadata (§2.4, §3.1).
  rpc GetChunkLocations(GetChunkLocationsRequest) returns (GetChunkLocationsResponse);
  rpc GetLeaseHolder(GetLeaseHolderRequest) returns (GetLeaseHolderResponse);

  // Chunkserver -> master (§2.6.2, §4.4, §5.2).
  rpc Register(RegisterRequest) returns (RegisterResponse);
  rpc Heartbeat(HeartbeatRequest) returns (HeartbeatResponse);

  // Shadow master log shipping (§5.1.3).
  rpc StreamLog(StreamLogRequest) returns (stream LogRecord);
  rpc FetchCheckpoint(Empty) returns (Checkpoint);

  // Introspection used by tests, the CLI and benchmarks.
  rpc ClusterStatus(Empty) returns (ClusterStatusResponse);
}

message ConfigResponse {
  int64 chunk_size = 1;
  int64 block_size = 2;
  int32 default_replication = 3;
  bool is_shadow = 4;
}

message MkdirRequest {
  string path = 1;
  bool parents = 2;
}

message CreateFileRequest {
  string path = 1;
  int32 replication = 2; // 0 = cluster default
}

// Deleting a file renames it to a hidden name under /.deleted; it is
// removed for good, and its chunks reclaimed, after the trash retention
// period (§4.4.1). Deleting a hidden file removes it at once.
message DeleteFileRequest { string path = 1; }

message UndeleteRequest { string path = 1; } // hidden name, e.g. /.deleted/...

message UndeleteResponse { string path = 1; } // where the file was restored

message ListRequest { string path = 1; }

message ListEntry {
  string name = 1;
  bool is_dir = 2;
  int64 num_chunks = 3;
  string deleted_from = 4;      // hidden (deleted) files: original path
  int64 deleted_unix_nanos = 5; // hidden (deleted) files: deletion time
}

message ListResponse { repeated ListEntry entries = 1; }

message StatRequest { string path = 1; }

message SnapshotRequest {
  string source = 1;
  string target = 2; // must not exist
}

message StatResponse {
  bool is_dir = 1;
  int64 num_chunks = 2;
  int32 replication = 3;
  int64 ctime_unix_nanos = 4;
  string deleted_from = 5;
  int64 deleted_unix_nanos = 6;
}

message GetChunkLocationsRequest {
  string path = 1;
  int64 start_index = 2;
  int32 count = 3; // master also returns following chunks to save round trips (§2.4)
}

message GetChunkLocationsResponse {
  repeated ChunkLocation chunks = 1;
  int64 num_chunks = 2;
}

message GetLeaseHolderRequest {
  string path = 1;
  int64 index = 2;
  bool allocate = 3; // create missing chunks up to and including index
}

message GetLeaseHolderResponse {
  ChunkLocation chunk = 1;
  string primary = 2;
  repeated string secondaries = 3;
  int64 lease_expiry_unix_nanos = 4; // master clock; a hint for client cache expiry
}

message RegisterRequest {
  string server_id = 1;
  string address = 2;
  repeated ChunkReport chunks = 3; // full report
  int64 disk_used = 4;
  int64 disk_free = 5;
}

message RegisterResponse {
  int64 chunk_size = 1;
  int64 heartbeat_interval_ms = 2;
  repeated uint64 garbage = 3; // chunks to delete: orphaned or stale (§4.4, §4.5)
}

message HeartbeatRequest {
  string server_id = 1;
  string address = 2;
  int64 disk_used = 3;
  int64 disk_free = 4;
  repeated ChunkReport chunks = 5;       // rotating subset of held chunks
  repeated uint64 lease_extensions = 6;  // chunks this server is primary for and mutating (§3.1)
  repeated uint64 corrupted = 7;         // replicas that failed checksum verification (§5.2)
  int64 sent_unix_nanos = 8;
}

message LeaseExtension {
  uint64 handle = 1;
  int64 duration_ms = 2;
}

message HeartbeatResponse {
  bool reregister = 1; // master does not know this server (e.g. master restarted)
  repeated uint64 garbage = 2;
  repeated LeaseExtension extended = 3;
}

message StreamLogRequest { uint64 from_lsn = 1; }

message ServerStatus {
  string server_id = 1;
  string address = 2;
  int64 num_chunks = 3;
  int64 disk_used = 4;
  int64 disk_free = 5;
  int64 last_heartbeat_ms_ago = 6;
}

message ClusterStatusResponse {
  repeated ServerStatus servers = 1;
  int64 num_files = 2;
  int64 num_chunks = 3;
  // replica_histogram[i] = number of chunks with exactly i live, up-to-date replicas.
  repeated int64 replica_histogram = 4;
  int64 under_replicated = 5;
  int64 clones_in_flight = 6;
  int64 clones_completed = 7;
  uint64 applied_lsn = 8;
  bool is_shadow = 9;
  int64 deleted_files = 10; // hidden files awaiting garbage collection
}

// ───────────────────────── Chunkserver ─────────────────────────

service ChunkServer {
  // Data flow (§3.2). The first frame carries the header; every frame is
  // forwarded to the next hop as soon as it arrives.
  rpc PushData(stream PushDataFrame) returns (PushDataResponse);

  // Control flow, client -> primary (§3.1 step 4).
  rpc Write(WriteRequest) returns (Empty);
  // Primary -> secondaries (§3.1 step 5).
  rpc ApplyMutation(ApplyMutationRequest) returns (Empty);
  // Record append (§3.3): the primary chooses the offset.
  rpc RecordAppend(RecordAppendRequest) returns (RecordAppendResponse);

  // Reads verify the checksums of every overlapped block (§5.2).
  rpc Read(ReadRequest) returns (stream DataFrame);
  rpc ChunkInfo(ChunkInfoRequest) returns (ChunkReport);

  // Master -> chunkserver.
  rpc CreateChunk(CreateChunkRequest) returns (Empty);
  rpc SetVersion(SetVersionRequest) returns (Empty);
  rpc GrantLease(GrantLeaseRequest) returns (Empty);
  rpc RevokeLease(RevokeLeaseRequest) returns (Empty);
  rpc CloneChunk(CloneChunkRequest) returns (ChunkReport);
  // Copy-on-write after a snapshot (§3.4): duplicate a replica on this
  // server under a new handle, without touching the network.
  rpc CopyChunk(CopyChunkRequest) returns (ChunkReport);
  rpc DeleteChunks(DeleteChunksRequest) returns (Empty);
  rpc VerifyAll(Empty) returns (VerifyAllResponse);
}

message PushDataFrame {
  string data_id = 1;         // set on the first frame only
  repeated string chain = 2;  // remaining downstream hops; first frame only
  bytes payload = 3;
}

message PushDataResponse { int64 bytes = 1; }

message WriteRequest {
  uint64 handle = 1;
  uint64 version = 2;
  int64 offset = 3;
  string data_id = 4;
  repeated string secondaries = 5;
}

message ApplyMutationRequest {
  uint64 handle = 1;
  uint64 version = 2;
  uint64 serial = 3;
  int64 offset = 4;
  string data_id = 5;
  int64 pad_to = 6; // record append: pad the chunk with zeros to this length instead of writing data
}

message RecordAppendRequest {
  uint64 handle = 1;
  uint64 version = 2;
  string data_id = 3;
  repeated string secondaries = 4;
}

message RecordAppendResponse {
  int64 offset = 1;     // offset within the chunk where the record was written
  bool chunk_full = 2;  // record did not fit: the chunk was padded; retry on the next chunk
}

message ReadRequest {
  uint64 handle = 1;
  uint64 min_version = 2;
  int64 offset = 3;
  int64 length = 4;
}

message DataFrame { bytes data = 1; }

message ChunkInfoRequest { uint64 handle = 1; }

message CreateChunkRequest {
  uint64 handle = 1;
  uint64 version = 2;
}

message SetVersionRequest {
  uint64 handle = 1;
  uint64 old_version = 2; // replica must currently be at this version, else it is stale
  uint64 new_version = 3;
}

message GrantLeaseRequest {
  uint64 handle = 1;
  uint64 version = 2;
  int64 duration_ms = 3;
}

message RevokeLeaseRequest { uint64 handle = 1; }

message CloneChunkRequest {
  uint64 handle = 1;
  uint64 version = 2;
  string source = 3;
}

message CopyChunkRequest {
  uint64 handle = 1;
  uint64 version = 2; // the local replica must be at this version
  uint64 new_handle = 3;
  uint64 new_version = 4;
}

message DeleteChunksRequest { repeated uint64 handles = 1; }

message VerifyAllResponse {
  int64 chunks = 1;
  int64 bytes = 2;
  repeated uint64 corrupted = 3;
}

// ───────────────────── Persistent records ─────────────────────

// One entry in the master's operation log (§2.6.3). Every metadata change
// is one of these; recovery and the shadow master replay them in LSN order.
message LogRecord {
  uint64 lsn = 1;
  int64 unix_nanos = 2;
  oneof op {
    MkdirOp mkdir = 10;
    CreateFileOp create_file = 11;
    DeleteFileOp delete_file = 12;
    AddChunkOp add_chunk = 13;
    SetVersionOp set_version = 14;
    SnapshotOp snapshot = 15;
    ReplaceChunkOp replace_chunk = 16;
    TrashFileOp trash_file = 17;
    RestoreFileOp restore_file = 18;
  }
}

message MkdirOp { string path = 1; }

message CreateFileOp {
  string path = 1;
  int32 replication = 2;
}

// Removes a file (its chunks lose a reference) or an empty directory.
message DeleteFileOp { string path = 1; }

// Lazy deletion (§4.4.1): renames path to a hidden name derived from the
// record's LSN and timestamp, /.deleted/<unix_nanos>-<lsn>-<base name>.
message TrashFileOp { string path = 1; }

// Undelete: moves a hidden file back to where it was deleted from.
message RestoreFileOp { string hidden = 1; }

message AddChunkOp {
  string path = 1;
  int64 index = 2;
  uint64 handle = 3;
  uint64 version = 4;
}

message SetVersionOp {
  uint64 handle = 1;
  uint64 version = 2;
}

// Duplicates the metadata of a file or directory tree. The copies share
// the source's chunks, whose reference counts go up by one (§3.4).
message SnapshotOp {
  string source = 1;
  string target = 2;
}

// Copy-on-write: chunk index of path stops referencing old_handle and
// references new_handle, a fresh local copy of it (§3.4).
message ReplaceChunkOp {
  string path = 1;
  int64 index = 2;
  uint64 old_handle = 3;
  uint64 new_handle = 4;
  uint64 version = 5;
}

message FileState {
  string path = 1;
  int32 replication = 2;
  int64 ctime_unix_nanos = 3;
  repeated uint64 chunks = 4;
  string deleted_from = 5;
  int64 deleted_unix_nanos = 6;
}

message ChunkState {
  uint64 handle = 1;
  uint64 version = 2;
  int32 refcount = 3;
}

message Checkpoint {
  uint64 lsn = 1;
  uint64 next_handle = 2;
  repeated string dirs = 3;
  repeated FileState files = 4;
  repeated ChunkState chunks = 5;
}

// Per-chunk metadata persisted by the chunkserver next to the chunk file.
message ChunkMeta {
  uint64 handle = 1;
  uint64 version = 2;
  int64 length = 3;
  repeated fixed32 block_crc = 4;
}
